<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HSL Trainer</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1a1d24;--panel2:#222630;--text:#f5f7fb;--muted:#a8afbd;--line:rgba(255,255,255,.11);--accent:#f3f5f8;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
body{position:fixed;inset:0;touch-action:manipulation}
button,input{font:inherit}
.app{height:100dvh;min-height:0;max-width:720px;margin:auto;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.brand{min-width:0}.brand h1{margin:0;font-size:18px;line-height:1.1}.hint{margin-top:3px;color:var(--muted);font-size:10px;white-space:nowrap}.round{font-size:12px;color:var(--muted);white-space:nowrap}
.game{min-height:0;display:grid;grid-template-rows:minmax(100px,1fr) auto auto;gap:10px}
.swatches{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{min-height:0;display:grid;grid-template-rows:auto 1fr;overflow:hidden;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.card-head{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;background:rgba(0,0,0,.16);font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.swatch{min-height:0}.target{background:hsl(220,70%,52%)}.guess{background:hsl(180,50%,50%)}
.controls{display:grid;gap:7px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.row{display:grid;grid-template-columns:62px 34px minmax(0,1fr) 34px 48px;align-items:center;gap:7px;min-height:42px}
.name{display:flex;align-items:baseline;gap:5px;white-space:nowrap}.letter{font-size:18px;font-weight:900}.jp{font-size:11px;font-weight:800;color:var(--muted)}
.step{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:22px;line-height:1;padding:0;display:grid;place-items:center;touch-action:manipulation}.step:active{transform:scale(.94)}
.value{text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.slider-shell{position:relative;height:12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:var(--track,linear-gradient(90deg,#555,#ddd));box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.slider-shell.hue{background:linear-gradient(90deg,#f00 0%,#ff0 16.67%,#0f0 33.33%,#0ff 50%,#00f 66.67%,#f0f 83.33%,#f00 100%)}
.range{position:absolute;left:0;right:0;top:50%;width:100%;height:36px;transform:translateY(-50%);margin:0;padding:0;appearance:none;-webkit-appearance:none;background:transparent;touch-action:none}
.range::-webkit-slider-runnable-track{height:12px;background:transparent;border:0}.range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-8px;border-radius:50%;border:3px solid #fff;background:#15171c;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.range::-moz-range-track{height:12px;background:transparent;border:0}.range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;border:3px solid #fff;background:#15171c}
.result{min-height:48px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);display:grid;align-items:center}.result.hidden{visibility:hidden}.result-line{display:flex;align-items:center;justify-content:space-between;gap:10px}.score{font-size:24px;font-weight:900}.details{text-align:right;color:var(--muted);font-size:10px;line-height:1.45;font-variant-numeric:tabular-nums}
.actions{display:grid;gap:7px}.btn{min-height:50px;border:0;border-radius:16px;padding:0 16px;font-size:16px;font-weight:900;touch-action:manipulation}.primary{background:var(--accent);color:#111318}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
@media(max-height:720px){.app{gap:7px;padding-top:max(7px,env(safe-area-inset-top));padding-bottom:max(7px,env(safe-area-inset-bottom))}.top{min-height:29px}.brand h1{font-size:16px}.hint{display:none}.game{gap:7px;grid-template-rows:minmax(82px,1fr) auto auto}.card-head{padding:6px 8px}.controls{gap:3px;padding:7px 8px}.row{min-height:36px;grid-template-columns:58px 30px minmax(0,1fr) 30px 46px;gap:5px}.step{width:30px;height:30px;border-radius:9px}.letter{font-size:16px}.jp{font-size:10px}.result{min-height:42px;padding:6px 8px}.score{font-size:21px}.btn{min-height:45px}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><h1>HSL Trainer</h1><div class="hint">H＝色相（色の種類） / S＝彩度（鮮やかさ） / L＝明度（明るさ）</div></div>
    <div class="round" id="round">1問目</div>
  </header>

  <section class="game">
    <div class="swatches">
      <div class="card"><div class="card-head"><span>TARGET</span><span>お題</span></div><div class="swatch target" id="target"></div></div>
      <div class="card"><div class="card-head"><span>YOUR COLOR</span><span>予想</span></div><div class="swatch guess" id="guess"></div></div>
    </div>

    <div class="controls">
      <div class="row">
        <div class="name"><span class="letter">H</span><span class="jp">色相</span></div>
        <button class="step" type="button" data-for="h" data-dir="-1" aria-label="色相を1下げる">−</button>
        <div class="slider-shell hue"><input class="range" id="h" type="range" min="0" max="359" value="180" step="1" aria-label="色相"></div>
        <button class="step" type="button" data-for="h" data-dir="1" aria-label="色相を1上げる">＋</button>
        <div class="value" id="hv">180°</div>
      </div>
      <div class="row">
        <div class="name"><span class="letter">S</span><span class="jp">彩度</span></div>
        <button class="step" type="button" data-for="s" data-dir="-1" aria-label="彩度を1パーセント下げる">−</button>
        <div class="slider-shell" id="sTrack"><input class="range" id="s" type="range" min="0" max="100" value="50" step="1" aria-label="彩度"></div>
        <button class="step" type="button" data-for="s" data-dir="1" aria-label="彩度を1パーセント上げる">＋</button>
        <div class="value" id="sv">50%</div>
      </div>
      <div class="row">
        <div class="name"><span class="letter">L</span><span class="jp">明度</span></div>
        <button class="step" type="button" data-for="l" data-dir="-1" aria-label="明度を1パーセント下げる">−</button>
        <div class="slider-shell" id="lTrack"><input class="range" id="l" type="range" min="0" max="100" value="50" step="1" aria-label="明度"></div>
        <button class="step" type="button" data-for="l" data-dir="1" aria-label="明度を1パーセント上げる">＋</button>
        <div class="value" id="lv">50%</div>
      </div>
    </div>

    <div class="result hidden" id="result"><div class="result-line"><div class="score" id="score">--点</div><div class="details" id="details"></div></div></div>
  </section>

  <div class="actions">
    <button class="btn primary" id="judge" type="button">判定する</button>
    <button class="btn secondary" id="next" type="button" hidden>次の問題</button>
  </div>
</main>

<script>
(function(){
'use strict';
function el(id){return document.getElementById(id);}
var H=el('h'),S=el('s'),L=el('l');
var targetEl=el('target'),guessEl=el('guess'),sTrack=el('sTrack'),lTrack=el('lTrack');
var resultEl=el('result'),scoreEl=el('score'),detailsEl=el('details'),judgeBtn=el('judge'),nextBtn=el('next');
var target={h:210,s:70,l:52},round=0,judged=false;
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function clamp(n,min,max){return Math.min(max,Math.max(min,n));}
function hslCss(c){return 'hsl('+c.h+', '+c.s+'%, '+c.l+'%)';}
function guess(){return {h:parseInt(H.value,10),s:parseInt(S.value,10),l:parseInt(L.value,10)};}
function paint(){
  var g=guess();
  guessEl.style.backgroundColor=hslCss(g);
  el('hv').textContent=g.h+'°';el('sv').textContent=g.s+'%';el('lv').textContent=g.l+'%';
  sTrack.style.setProperty('--track','linear-gradient(90deg, hsl('+g.h+', 0%, '+g.l+'%), hsl('+g.h+', 100%, '+g.l+'%))');
  lTrack.style.setProperty('--track','linear-gradient(90deg, hsl('+g.h+', '+g.s+'%, 0%), hsl('+g.h+', '+g.s+'%, 50%), hsl('+g.h+', '+g.s+'%, 100%))');
}
function newRound(){
  round+=1;judged=false;
  target={h:rand(0,359),s:rand(28,92),l:rand(24,76)};
  H.value=rand(0,359);S.value=rand(28,72);L.value=rand(32,68);
  targetEl.style.backgroundColor=hslCss(target);
  el('round').textContent=round+'問目';
  resultEl.classList.add('hidden');judgeBtn.hidden=false;nextBtn.hidden=true;paint();
}
function stepValue(id,dir){
  var r=el(id),v=parseInt(r.value,10)+dir;
  if(id==='h'){if(v<0)v=359;if(v>359)v=0;}else{v=clamp(v,0,100);}
  r.value=v;paint();
}
function hslToRgb(c){
  var h=((c.h%360)+360)%360,s=c.s/100,l=c.l/100;
  var chroma=(1-Math.abs(2*l-1))*s;
  var x=chroma*(1-Math.abs((h/60)%2-1));
  var m=l-chroma/2,r1=0,g1=0,b1=0;
  if(h<60){r1=chroma;g1=x;}else if(h<120){r1=x;g1=chroma;}else if(h<180){g1=chroma;b1=x;}else if(h<240){g1=x;b1=chroma;}else if(h<300){r1=x;b1=chroma;}else{r1=chroma;b1=x;}
  return [r1+m,g1+m,b1+m];
}
function rgbToLab(rgb){
  function lin(v){return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);}
  var r=lin(rgb[0]),g=lin(rgb[1]),b=lin(rgb[2]);
  var x=(r*0.4124564+g*0.3575761+b*0.1804375)/0.95047;
  var y=r*0.2126729+g*0.7151522+b*0.072175;
  var z=(r*0.0193339+g*0.119192+b*0.9503041)/1.08883;
  function f(t){return t>0.008856451679?Math.pow(t,1/3):(7.787037037*t+16/116);}
  var fx=f(x),fy=f(y),fz=f(z);return [116*fy-16,500*(fx-fy),200*(fy-fz)];
}
function deltaE(a,b){var d0=a[0]-b[0],d1=a[1]-b[1],d2=a[2]-b[2];return Math.sqrt(d0*d0+d1*d1+d2*d2);}
function judge(){
  if(judged)return;judged=true;
  var g=guess(),d=deltaE(rgbToLab(hslToRgb(target)),rgbToLab(hslToRgb(g)));
  var points=clamp(Math.round(100*Math.exp(-Math.pow(d/24,1.25))),0,100);
  scoreEl.textContent=points+'点';
  detailsEl.innerHTML='正解 H '+target.h+'° / S '+target.s+'% / L '+target.l+'%<br>予想 H '+g.h+'° / S '+g.s+'% / L '+g.l+'%';
  resultEl.classList.remove('hidden');judgeBtn.hidden=true;nextBtn.hidden=false;
}
[H,S,L].forEach(function(r){r.addEventListener('input',paint,{passive:true});});
document.querySelectorAll('.step').forEach(function(btn){btn.addEventListener('click',function(){stepValue(btn.getAttribute('data-for'),parseInt(btn.getAttribute('data-dir'),10));});});
document.addEventListener('touchmove',function(e){if(!e.target.closest('.range'))e.preventDefault();},{passive:false});
judgeBtn.addEventListener('click',judge);nextBtn.addEventListener('click',newRound);
newRound();
})();
</script>
</body>
</html>
