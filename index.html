<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta id="viewportMeta" name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HSL Trainer</title>
<link rel="stylesheet" href="styles.css?v=5">
<style>
.interaction-toggle{position:fixed;z-index:9999;top:max(9px,env(safe-area-inset-top));right:10px;height:34px;padding:0 11px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(35,38,47,.92);color:#f5f7fb;font-size:11px;font-weight:850;display:flex;align-items:center;gap:5px;box-shadow:0 4px 16px rgba(0,0,0,.24);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);touch-action:manipulation}
.interaction-toggle:active{transform:scale(.96)}
#gameScreen .game-topline{padding-right:76px}
html.interaction-unlocked,html.interaction-unlocked body{height:auto;min-height:100%;overflow:auto;overscroll-behavior:auto}
html.interaction-unlocked body{position:static;inset:auto;touch-action:auto}
html.interaction-unlocked .screen.active{position:relative;inset:auto;min-height:100dvh}
html.interaction-unlocked .shell{height:auto;min-height:100dvh}
html.interaction-unlocked .range{touch-action:auto}
html.interaction-unlocked #summaryScreen{overflow:visible}
html.interaction-unlocked .summary-shell{height:auto;min-height:100dvh;overflow:visible}
@media(max-height:720px){.interaction-toggle{height:30px;padding:0 9px;font-size:10px}#gameScreen .game-topline{padding-right:68px}}
</style>
</head>
<body>
<button class="interaction-toggle" id="interactionToggle" type="button" aria-pressed="true" aria-label="画面操作を固定中。タップで拡大とスクロールを許可"><span id="interactionIcon">🔒</span><span id="interactionLabel">固定</span></button>
<section class="screen active" id="menuScreen">
  <div class="shell menu-wrap">
    <div class="menu-card">
      <div class="logo menu-title"><span class="logo-dot"></span><span>HSLトレーナー</span></div>
      <div class="menu-sub">色相・彩度・明度の見極めをトレーニング</div>
      <div class="mode-list">
        <button class="mode-card" type="button" data-mode="easy">
          <div class="mode-top"><div class="mode-name">イージー</div><div class="mode-arrow">›</div></div>
          <div class="mode-desc">明度は固定（30〜70%）— 色相と彩度だけ合わせる</div>
          <div class="mode-best" id="easyBest">ベスト —</div>
        </button>
        <button class="mode-card" type="button" data-mode="normal">
          <div class="mode-top"><div class="mode-name">ノーマル</div><div class="mode-arrow">›</div></div>
          <div class="mode-desc">色相・彩度・明度をすべて合わせる</div>
          <div class="mode-best" id="normalBest">ベスト —</div>
        </button>
      </div>
      <div class="layout-setting">
        <div class="layout-setting-head"><span>画面レイアウト</span><span id="layoutHint">iPhone</span></div>
        <div class="layout-toggle" role="group" aria-label="画面レイアウト">
          <button class="layout-option active" type="button" data-layout="phone" aria-pressed="true">iPhone</button>
          <button class="layout-option" type="button" data-layout="ipad" aria-pressed="false">iPad</button>
        </div>
      </div>
      <div class="menu-foot">1セッション 5問 / 500点満点</div>
    </div>
  </div>
</section>
<section class="screen" id="gameScreen">
  <div class="shell game-shell">
    <div class="game-head">
      <div class="game-topline">
        <div class="logo game-logo"><span class="logo-dot"></span><span>HSLトレーナー</span></div>
        <div class="stats"><div class="stat-pill" id="modePill">イージー</div><div class="stat-pill">合計 <strong id="runningTotal">0 pt</strong></div></div>
      </div>
      <div class="progress" id="progressDots"></div>
    </div>
    <main class="game-main">
      <div class="swatches">
        <div class="swatch-card"><div class="card-head"><span>TARGET</span><span>お題</span></div><div class="swatch" id="target"></div></div>
        <div class="swatch-card"><div class="card-head"><span>YOUR COLOR</span><span>予想</span></div><div class="swatch" id="guess"></div></div>
      </div>
      <div class="controls">
        <div class="row" id="hRow">
          <div class="name"><span class="letter">H</span><span class="jp">色相</span></div>
          <button class="step" type="button" data-for="h" data-dir="-1">−</button>
          <div class="slider-shell hue"><input class="range" id="h" type="range" min="0" max="359" value="180" step="1" aria-label="色相"></div>
          <button class="step" type="button" data-for="h" data-dir="1">＋</button>
          <div class="value" id="hv">180°</div>
        </div>
        <div class="row" id="sRow">
          <div class="name"><span class="letter">S</span><span class="jp">彩度</span></div>
          <button class="step" type="button" data-for="s" data-dir="-1">−</button>
          <div class="slider-shell" id="sTrack"><input class="range" id="s" type="range" min="0" max="100" value="50" step="1" aria-label="彩度"></div>
          <button class="step" type="button" data-for="s" data-dir="1">＋</button>
          <div class="value" id="sv">50%</div>
        </div>
        <div class="row" id="lRow">
          <div class="name"><span class="letter">L</span><span class="jp">明度</span><span class="lock-note" id="lockNote"></span></div>
          <button class="step" type="button" data-for="l" data-dir="-1">−</button>
          <div class="slider-shell" id="lTrack"><input class="range" id="l" type="range" min="0" max="100" value="50" step="1" aria-label="明度"></div>
          <button class="step" type="button" data-for="l" data-dir="1">＋</button>
          <div class="value" id="lv">50%</div>
        </div>
      </div>
    </main>
    <div class="game-actions"><button class="primary" id="judgeBtn" type="button">判定する</button></div>
  </div>
</section>
<section class="screen" id="questionResultScreen">
  <div class="shell result-wrap">
    <div class="result-card">
      <div class="grade-block">
        <div class="grade-badge" id="gradeBadge">A</div>
        <div class="big-score"><span id="questionScore">88</span> <span>/ 100</span></div>
        <div class="delta" id="deltaText">ΔE 3.0</div>
      </div>
      <div class="compare-block">
        <div class="compare-swatch"><div id="resultTargetColor"></div><div id="resultGuessColor"></div></div>
        <div class="compare-labels"><span>ターゲット</span><span>あなたの色</span></div>
        <div class="legend"><span class="legend-item"><span class="legend-dot"></span>あなたの色</span><span class="legend-item"><span class="legend-ring"></span>ターゲット</span></div>
      </div>
      <div class="compare-rows">
        <div class="compare-row"><div class="compare-name">色相</div><div class="compare-track h" id="hCompare"><span class="marker guess" id="hg"></span><span class="marker target" id="ht"></span></div><div class="compare-diff" id="hdiff">-9°</div></div>
        <div class="compare-row"><div class="compare-name">彩度</div><div class="compare-track s" id="sCompare"><span class="marker guess" id="sg"></span><span class="marker target" id="st"></span></div><div class="compare-diff" id="sdiff">-12%</div></div>
        <div class="compare-row" id="lCompareRow"><div class="compare-name">明度</div><div class="compare-track l" id="lCompare"><span class="marker guess" id="lg"></span><span class="marker target" id="lt"></span></div><div class="compare-diff" id="ldiff">0%</div></div>
      </div>
      <div class="exact" id="exactValues"></div>
      <button class="primary" id="nextBtn" type="button">次の問題</button>
    </div>
  </div>
</section>
<section class="screen" id="summaryScreen">
  <div class="summary-shell">
    <div class="summary-card">
      <div class="summary-title">セッション完了 <span class="mode-tag" id="summaryMode">イージー</span></div>
      <div class="record"><div class="record-badge" id="recordBadge">新記録!</div><div class="total"><span id="totalScore">437</span> <span>/ 500</span></div><div class="summary-meta" id="summaryMeta">平均 ΔE 3.1 / ベスト 437</div></div>
      <div class="round-list" id="roundList"></div>
      <div class="summary-actions"><button class="primary" id="retryBtn" type="button">もう一度</button><button class="secondary" id="modeSelectBtn" type="button">モードを選ぶ</button></div>
    </div>
  </div>
</section>
<script src="app.js?v=4"></script>
<script>
(function(){
  'use strict';
  var locked=true;
  var html=document.documentElement;
  var viewport=document.getElementById('viewportMeta');
  var button=document.getElementById('interactionToggle');
  var icon=document.getElementById('interactionIcon');
  var label=document.getElementById('interactionLabel');
  function apply(){
    html.classList.toggle('interaction-unlocked',!locked);
    if(locked){
      viewport.setAttribute('content','width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no');
      icon.textContent='🔒';label.textContent='固定';button.setAttribute('aria-pressed','true');button.setAttribute('aria-label','画面操作を固定中。タップで拡大とスクロールを許可');
    }else{
      viewport.setAttribute('content','width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5,user-scalable=yes');
      icon.textContent='🔓';label.textContent='自由';button.setAttribute('aria-pressed','false');button.setAttribute('aria-label','拡大とスクロールを許可中。タップで画面操作を固定');
    }
  }
  button.addEventListener('click',function(){locked=!locked;apply()});
  document.addEventListener('touchmove',function(e){if(!locked)e.stopImmediatePropagation()},{capture:true,passive:true});
  apply();
})();
</script>
</body>
</html>
